<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NHC NETWORK Status by Region</title>
    <meta http-equiv="refresh" content="5">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <!-- Logo & Title -->
        <div class="flex flex-col items-center mb-6">
            <img src="{{ url_for('static', filename='nhc.webp') }}" alt="NHC Logo" class="w-24 h-24 mb-3 animate-bounce">
            <h1 class="text-4xl font-bold text-center text-blue-700 mb-2 animate-fadeIn">
                NHC NETWORK IP Status by Region
            </h1>
            <p class="text-gray-500">Auto-refresh every 5 seconds</p>
        </div>

        <!-- Grid: 2 columns -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            {% for region, ips in results.items() %}
                <div class="bg-white shadow-lg rounded-xl p-6 border border-gray-200 hover:shadow-2xl transition duration-300 animate-fadeIn">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-4">{{ region }}</h2>

                    <div class="space-y-2 text-sm">
                        {% for ip in ips %}
                            <div class="flex justify-between items-center p-2 rounded-md
                                        {% if ip.status == 'ACTIVE ✅' %} bg-green-50 border-l-4 border-green-500 animate-pulse
                                        {% elif ip.status == 'INACTIVE ❌' %} bg-red-50 border-l-4 border-red-500 animate-pulse
                                        {% else %} bg-yellow-50 border-l-4 border-yellow-500 animate-pulse {% endif %}">
                                <span class="font-mono">{{ ip.label }}: {{ ip.ip }}</span>
                                <span class="font-semibold">{{ ip.status }}</span>
                            </div>
                        {% endfor %}
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>

    <style>
        /* Fade in animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.6s ease-in-out;
        }
    </style>
</body>
</html>
